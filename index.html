    <meta name="description" content="Aarav Chopra builds websites. Taking new clients." />
    <!-- The site is dark-only, so both schemes get the page colour. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B0B0A" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0A" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- .js: script is running (hide only what JavaScript will reveal).
         .motion: the cinematic layout, chosen before first paint so mounting the
         films shifts nothing. Never under reduced motion or ?tier=3, and dropped
         again if the films have not mounted within 10s. -->
    <script>(function(h){h.classList.add('js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!/[?&]tier=3\b/.test(location.search)){h.classList.add('motion');setTimeout(function(){if(!document.querySelector('#reveal.is-live'))h.classList.remove('motion')},10000)}})(document.documentElement)</script>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/home/entry.ts"></script>
  </head>
