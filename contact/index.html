<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Contact — Aarav, Website Builder</title>
    <meta name="description" content="Start a project with Aarav: send a message, email, WhatsApp or call." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B0B0A" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0A" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/entries/contact.ts"></script>
  </head>
  <body class="page page--contact">
    <a class="skip" href="#main">Skip to content</a>
    <!--@header-->
    <main id="main" class="page__main contact">
      <header class="page-title">
        <p class="label" aria-hidden="true">Reel 03 — Contact</p>
        <h1 class="page-title__h1">Start a project</h1>
        <p class="page-title__lede">Tell Aarav about the site you need, or reach him directly.</p>
        <!--@status-->
      </header>

      <div class="contact__grid">
        <!-- Posts to the Cloudflare Pages Function. Works without JS (the function
             answers a form post with an HTML page); JS adds inline validation and a toast. -->
        <form class="form" action="/api/contact" method="post" novalidate data-contact-form>
          <div class="field">
            <label class="field__label" for="f-name">Your name</label>
            <input class="field__input" id="f-name" name="name" type="text" autocomplete="name"
                   required minlength="1" maxlength="100" enterkeyhint="next" aria-describedby="f-name-err" />
            <p class="field__error" id="f-name-err" data-error-for="name"></p>
          </div>
          <div class="field">
            <label class="field__label" for="f-email">Your email</label>
            <input class="field__input" id="f-email" name="email" type="email" inputmode="email" autocomplete="email"
                   autocapitalize="none" autocorrect="off" spellcheck="false"
                   required maxlength="254" enterkeyhint="next" aria-describedby="f-email-err" />
            <p class="field__error" id="f-email-err" data-error-for="email"></p>
          </div>
          <div class="field">
            <label class="field__label" for="f-message">About the project</label>
            <textarea class="field__input field__input--area" id="f-message" name="message" rows="6"
                      required minlength="10" maxlength="5000" enterkeyhint="send" aria-describedby="f-message-err f-message-hint"></textarea>
            <p class="field__hint" id="f-message-hint">At least 10 characters.</p>
            <p class="field__error" id="f-message-err" data-error-for="message"></p>
          </div>
          <!-- Spam traps. Humans never see or fill these. -->
          <div class="hp" aria-hidden="true">
            <label for="f-website">Leave this empty</label>
            <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <!-- Signed timestamp, injected server-side by functions/contact/_middleware.ts. -->
          <input type="hidden" name="t" value="" data-form-token />
          <button class="button button--submit" type="submit" data-press data-submit>Send message</button>
        </form>

        <aside class="contact__direct" aria-labelledby="direct-h">
          <h2 class="label" id="direct-h">Or reach Aarav directly</h2>
          <!--@contact-routes-->
        </aside>
      </div>
    </main>
    <!--@footer-->
  </body>
</html>
